[project]
name = "actions-guard-mcp"
version = "0.1.0"
description = "GitHub Actions workflow security scanner (dangerous triggers, template injection, unpinned actions, excessive permissions) exposed as MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Berkant Acun" }]
keywords = ["mcp", "model-context-protocol", "github-actions", "security", "ci-cd", "static-analysis"]
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
]

[project.scripts]
actions-guard-mcp = "actions_guard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actions_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
